# Builds the Android app (android/) and attaches the APK to a GitHub release.
#
# Push a tag like v1.2.0 to publish release 1.2.0, or run it by hand from the Actions
# tab with a tag name. The APK is signed with the release key in the repository secrets
# (SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS,
# SIGNING_KEY_PASSWORD), the same key android/build.sh uses, so releases install over
# each other and over local builds.
name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Same Gradle as android/build.sh; the runner already has the Android SDK.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets: the APK is signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${TAG#v}" VERSION_CODE="${{ github.run_number }}"
          gradle --no-daemon -p android assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk "AI-Studio-$TAG.apk"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: AI Studio ${{ env.TAG }}
          files: AI-Studio-${{ env.TAG }}.apk
          body: |
            Android app for the studio's ComfyUI: install the APK on an Android 10+ phone,
            start ComfyUI with `./studio.sh start comfyui --lan` and enter its address in
            the app. See android/README.md.
